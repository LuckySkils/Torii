name: torii

# Shared settings for every container running the Torii image.
x-torii: &torii
  image: ghcr.io/${TORII_IMAGE_OWNER:-your-github-user}/torii:${TORII_TAG:-latest}
  # To build locally from a clone instead of pulling, comment `image` above and use:
  # build: .
  env_file: .env
  restart: unless-stopped

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-torii}
      POSTGRES_USER: ${DB_USERNAME:-torii}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: runs migrations, then exits. Everything else waits for it.
  migrate:
    <<: *torii
    restart: "no"
    environment:
      TORII_ROLE: migrate
    command: ["php", "artisan", "migrate", "--force"]
    depends_on:
      db:
        condition: service_healthy

  app:
    <<: *torii
    environment:
      TORII_ROLE: web
    ports:
      - "${TORII_PORT:-8080}:80"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *torii
    environment:
      TORII_ROLE: worker
    command: ["php", "artisan", "queue:work", "--sleep=3", "--max-time=3600"]
    stop_grace_period: 60s
    depends_on:
      migrate:
        condition: service_completed_successfully

  scheduler:
    <<: *torii
    environment:
      TORII_ROLE: scheduler
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
